name: Publish

# Publishing is driven by tags, so a release is `git tag v0.1.0 && git push --tags`
# rather than a checklist someone has to remember at the end of a long day.
on:
  push:
    tags: ["v*"]
  # Manual runs go to TestPyPI, so the publishing path itself can be exercised without
  # burning a real version number — PyPI refuses to reuse one, even after a delete.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group test --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest tests/ -q

  publish:
    # Gated on the tests: a tag that fails them should not become a release anyone can
    # install, and PyPI versions cannot be replaced once published.
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity through OIDC, so there
      # is no API token to store, rotate, or leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build

      - name: Check the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject version $VERSION." >&2
            echo "Bump the version, commit, then tag." >&2
            exit 1
          fi

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        run: uv publish --publish-url https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        run: uv publish
