name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms people migrate on. Windows is included because the token
        # and config stores touch file modes, which behave differently there.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group test --group dev
      - run: uv run ruff check src tests
      - run: uv run pytest tests/ -q

  image:
    # Builds the Docker image and runs it once, so a Dockerfile that no longer builds is
    # found on the pull request and not on the release tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t evernote2unbent .
      - run: docker run --rm evernote2unbent --version
