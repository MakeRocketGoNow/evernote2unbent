[project]
name = "evernote2unbent"
version = "0.1.2"
description = "Move your Evernote notes into Unbent, without an ENEX file in between."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "C Deutsch" }]
keywords = ["evernote", "unbent", "enex", "migration", "export", "notes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

dependencies = [
    # The Evernote sync — account auth, incremental sync, and the local SQLite database
    # this reads from. Depended on rather than forked: this package adds an uploader and a
    # CLI and modifies none of it, so upstream fixes arrive with a version bump.
    "evernote-backup>=1.14.0",
    "click>=8.1",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/MakeRocketGoNow/evernote2unbent"
Issues = "https://github.com/MakeRocketGoNow/evernote2unbent/issues"
Unbent = "https://unbent.app"
"Built on evernote-backup" = "https://github.com/vzhd1701/evernote-backup"

[project.scripts]
evernote2unbent = "evernote2unbent.cli:main"

[dependency-groups]
test = ["pytest", "pytest-mock", "requests-mock"]
dev = ["ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evernote2unbent"]

[tool.ruff]
# 90, matching evernote-backup, whose prose comments this code was written alongside.
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S", "PL"]
